services:
  postgres:
    image: postgres:17
    container_name: sunshine-erp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sunshine_erp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunshine_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: